<!DOCTYPE html>
<html>
<head>
  <title>Photo Booth</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --sage:#8aab8e; --sage-light:#b5cdb8; --sage-dark:#5c7a61;
      --cream:#f5f0e8; --warm-white:#fdfaf5; --mist:#dce8de;
      --text-dark:#2e3b2f; --text-mid:#5c6b5d; --text-soft:#8fa190;
      --glass:rgba(255,255,255,0.25); --glass-border:rgba(255,255,255,0.45);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:'DM Sans',sans-serif;
      background:#d4e2d6;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }
    .app{
      width:100%;max-width:480px;
      background:rgba(253,250,245,0.6);
      backdrop-filter:blur(20px);
      border-radius:30px;
      padding:20px;
      display:flex;flex-direction:column;gap:15px;
    }
    .header{display:flex;justify-content:space-between;}
    .title{font-family:'Playfair Display';font-style:italic;font-size:24px;}
    .photo-counter{font-size:12px;color:var(--text-soft);}

    .filters{display:flex;gap:6px;overflow:auto;}
    .filters button{
      padding:8px 16px;border-radius:20px;border:none;cursor:pointer;
      background:#eee;font-size:12px;
    }
    .filters .active{background:var(--sage);color:#fff;}

    .video-wrap{position:relative;aspect-ratio:3/4;border-radius:20px;overflow:hidden;}
    video{
      width:100%;height:100%;
      object-fit:cover;
      transform:scaleX(-1);
    }

    #countdown{
      position:absolute;inset:0;
      display:flex;justify-content:center;align-items:center;
      font-size:70px;color:#fff;
    }

    .shutter-row{display:flex;justify-content:center;align-items:center;gap:15px;}
    .shutter{
      width:70px;height:70px;border-radius:50%;
      background:var(--sage);
      display:flex;justify-content:center;align-items:center;
      font-size:28px;color:#fff;cursor:pointer;
    }

    .last-preview{width:50px;height:50px;border-radius:10px;overflow:hidden;}
    .last-preview img{width:100%;height:100%;object-fit:cover;}

    .progress{display:flex;gap:6px;}
    .dot{width:6px;height:6px;border-radius:50%;background:#ccc;}
    .dot.filled{background:var(--sage);}

    #stripCanvas{display:none;width:100%;border-radius:12px;background:#fff;}
    #stripCanvas.show{display:block;}

    #downloadBtn{
      display:none;padding:12px;border:none;border-radius:10px;
      background:var(--sage);color:#fff;cursor:pointer;
    }
    #downloadBtn.show{display:block;}
  </style>
</head>

<body>
<div class="app">

<div class="header">
  <div class="title">photo booth</div>
  <div id="counterLabel">0 / 4</div>
</div>

<div class="filters">
  <button onclick="setFilter('none',this)" class="active">Natural</button>
  <button onclick="setFilter('grayscale(100%)',this)">B&W</button>
  <button onclick="setFilter('sepia(70%)',this)">Latte</button>
</div>

<div class="video-wrap">
  <video id="video" autoplay playsinline></video>
  <div id="countdown"></div>
</div>

<div class="shutter-row">
  <div class="last-preview"><img id="lastImg"></div>
  <div class="shutter" onclick="nextPhoto()">📸</div>
  <div class="progress">
    <div class="dot" id="d0"></div>
    <div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div>
    <div class="dot" id="d3"></div>
  </div>
</div>

<canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
<canvas id="stripCanvas"></canvas>

<button id="downloadBtn" onclick="downloadStrip()">Download</button>

</div>

<script>

const video=document.getElementById('video')
const canvas=document.getElementById('canvas')
const ctx=canvas.getContext('2d')
const stripCanvas=document.getElementById('stripCanvas')
const stripCtx=stripCanvas.getContext('2d')

let photos=[]
let currentIndex=0
let currentFilter='none'

navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}})
.then(s=>video.srcObject=s)

function setFilter(f,el){
  currentFilter=f
  video.style.filter=f
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'))
  el.classList.add('active')
}

function nextPhoto(){
  if(currentIndex>=4){createStrip();return}
  countdown(3).then(capture)
}

function countdown(sec){
  return new Promise(r=>{
    let c=sec
    let el=document.getElementById('countdown')
    let i=setInterval(()=>{
      el.innerText=c
      c--
      if(c<0){clearInterval(i);el.innerText='';r()}
    },800)
  })
}

function capture(){

  const vw=video.videoWidth
  const vh=video.videoHeight

  canvas.width=vw
  canvas.height=vh

  ctx.save()
  ctx.translate(vw,0)
  ctx.scale(-1,1)
  ctx.filter=currentFilter
  ctx.drawImage(video,0,0,vw,vh)
  ctx.restore()

  let img=new Image()
  img.src=canvas.toDataURL()

  img.onload=()=>{
    photos[currentIndex]={
      img:img,
      time:new Date()
    }

    document.getElementById('lastImg').src=img.src
    currentIndex++
    updateDots()

    if(currentIndex==4){
      createStrip()
      document.getElementById('downloadBtn').classList.add('show')
    }
  }
}

function updateDots(){
  document.getElementById('counterLabel').innerText=currentIndex+" / 4"
  for(let i=0;i<4;i++){
    document.getElementById('d'+i).classList.toggle('filled',i<currentIndex)
  }
}

function createStrip(){

  const sw=640
  const ph=400
  const gap=30
  const pad=20

  stripCanvas.width=sw
  stripCanvas.height=(ph+gap+50)*photos.length

  stripCtx.fillStyle="#fdfaf5"
  stripCtx.fillRect(0,0,sw,stripCanvas.height)

  let y=0

  photos.forEach((p,idx)=>{

    stripCtx.drawImage(p.img,pad,y,sw-pad*2,ph)

    const date=p.time.toLocaleDateString('en-GB',{
      day:'numeric',month:'short',year:'numeric'
    })

    const time=p.time.toLocaleTimeString([],{
      hour:'2-digit',minute:'2-digit'
    })

    stripCtx.fillStyle="#8fa190"
    stripCtx.font="14px DM Sans"
    stripCtx.textAlign="center"

    stripCtx.fillText(
      `${String(idx+1).padStart(2,'0')} • ${date} • ${time}`,
      sw/2,
      y+ph+25
    )

    y+=ph+gap+50
  })
}

function downloadStrip(){
  let a=document.createElement('a')
  a.download='photostrip.png'
  a.href=stripCanvas.toDataURL()
  a.click()
}

updateDots()

</script>

</body>
</html>
